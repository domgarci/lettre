# Réglages du site d'archives de la lettre d'information.
# Modifiez les valeurs ci-dessous, puis enregistrez : GitHub Pages reconstruit le site seul.

title: "La Lettre de Domingo Garcia Garza"
description: "Recherches, publications et interventions sur la sociologie du goût, les spiritueux d'agave et l'Amérique latine."
author: "Domingo Garcia Garza"
lang: fr

# Adresse qui reçoit les demandes d'inscription et de désinscription.
email_contact: "prenom.nom@univ-lille.fr"

# Adresse publique du site, sans barre finale.
# Adresse finale : https://domgarci.github.io/lettre/
url: "https://domgarci.github.io"
baseurl: "/lettre"

permalink: /lettres/:year/:month/:title/
timezone: Europe/Paris

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: lettre

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - envois_test/
