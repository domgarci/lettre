---
layout: default
---
<article class="lettre">
  <p class="date">{{ page.date | date: "%d/%m/%Y" }}{% if page.numero %} · Lettre n° {{ page.numero }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.chapo %}<p class="chapo">{{ page.chapo }}</p>{% endif %}
  {{ content }}
</article>

<section class="encart-inscription">
  <p>Pour recevoir les prochaines lettres par courriel :
    <a class="bouton" href="mailto:{{ site.email_contact }}?subject=Inscription%20%C3%A0%20la%20lettre&amp;body=Je%20souhaite%20recevoir%20la%20lettre%20d%27information%20%C3%A0%20cette%20adresse.">s'abonner</a>
  </p>
</section>
