<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="entete">
    <a class="titre-site" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}#archives">Archives</a>
      <a href="{{ '/' | relative_url }}#inscription">S'abonner</a>
      <a href="{{ '/feed.xml' | relative_url }}">Flux RSS</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="pied">
    <p>{{ site.author }} · <a href="{{ '/confidentialite/' | relative_url }}">Données personnelles</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
