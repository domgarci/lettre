<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="theme-{{ page.theme | default: 'papier' }} grain">
  <header class="bandeau">
    <nav>
      <a href="{{ '/ressources/' | relative_url }}">Ressources</a>
      <a href="{{ '/communiques/' | relative_url }}">Communiqués</a>
      <a href="{{ '/agenda/' | relative_url }}">Agenda</a>
      <a href="{{ '/a-propos/' | relative_url }}">À propos</a>
    </nav>
    <a class="pastille" href="{{ '/' | relative_url }}" title="Accueil"><span>Accueil</span></a>
  </header>
  <main class="contenu">
    {{ content }}
  </main>
  <footer class="pied">
    <p>{{ site.author }} · <a href="mailto:{{ site.email_contact }}">{{ site.email_contact }}</a> · <a href="{{ '/a-propos/' | relative_url }}#inscription">S'abonner</a> · <a href="{{ '/confidentialite/' | relative_url }}">Données personnelles</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
